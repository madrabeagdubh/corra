<!-- Paste this into index.html, immediately after the opening <body> tag.
     It must come BEFORE the game's own <script> so it is listening early.

     Prints any uncaught error and its full stack to the screen, because
     there are no devtools on the target device. Remove it once the bug
     is found. -->

<div id="crash-overlay" style="
  display:none; position:fixed; inset:0; z-index:99999;
  background:rgba(0,0,0,.94); color:#ffb4b4;
  font:12px/1.45 monospace; padding:14px;
  overflow:auto; white-space:pre-wrap; word-break:break-word;
"></div>

<script>
(function () {
  var box = document.getElementById('crash-overlay');
  var shown = 0;

  function dump(title, err) {
    if (shown++ > 6) return;                 // don't drown in repeats
    var stack = (err && err.stack) || String(err);
    box.style.display = 'block';
    box.textContent += '=== ' + title + ' ===\n' + stack + '\n\n';
    // Also log it, in case a remote console is attached after all.
    console.error(title, err);
  }

  // Uncaught synchronous errors.
  window.addEventListener('error', function (e) {
    dump(e.message || 'error', e.error || (e.filename + ':' + e.lineno + ':' + e.colno));
  });

  // Rejected promises -- Phaser scene create() is async here, so a throw
  // inside it surfaces as an unhandled rejection rather than an error event.
  window.addEventListener('unhandledrejection', function (e) {
    dump('unhandled rejection', e.reason);
  });

  // Tap the overlay to dismiss and keep playing.
  box.addEventListener('click', function () {
    box.style.display = 'none';
    box.textContent = '';
    shown = 0;
  });
})();
</script>

  <!-- Main Game Script -->
  <script>
    // Handle start button: fullscreen, scroll, and remove button
    const startButton = document.getElementById('startButton');
    if (startButton) {
      startButton.addEventListener('pointerup', () => {
        const el = document.documentElement;
        try {
          if (el.requestFullscreen) el.requestFullscreen();
          else if (el.webkitRequestFullscreen) el.webkitRequestFullscreen();
        } catch (err) {}

        const container = document.getElementById('gameContainer');
        if (container) container.scrollIntoView({ behavior: 'smooth' });

        startButton.remove();
      }, { once: true });
    }

    // Resize game container on viewport changes
    function resizeGame() {
      const container = document.getElementById('gameContainer');
      if (container) container.style.height = window.innerHeight + 'px';
    }

    window.addEventListener('load', resizeGame);
    window.addEventListener('resize', resizeGame);
    window.addEventListener('orientationchange', resizeGame);
  </script>
